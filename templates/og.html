<!doctype html>
<html lang="$lang" dir="$dir">
<head>
<meta charset="utf-8">
<!-- The share image (1200x630), drawn by tools/og.py with headless Chrome. Fonts and pictures
     come in as data URIs; $dir decides which side the text and the devices are on. -->
<style>
  @font-face { font-family: 'Heebo'; src: url('$heebo') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Rubik'; src: url('$rubik') format('woff2'); font-weight: 300 900; }

  html, body { margin: 0; }
  html { overflow: hidden; }
  * { box-sizing: border-box; }

  body {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #07070e;
    color: #f5f3ff;
    font-family: 'Heebo', Arial, sans-serif;
    $aurora;
  }

  /* aurora: the projects' colors, the curtains of light and a faint star field */
  .sky {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(42% 70% at 6% 0%, color-mix(in oklab, var(--au2) 75%, transparent), transparent 70%),
      radial-gradient(40% 66% at 96% 4%, color-mix(in oklab, var(--au1) 70%, transparent), transparent 70%),
      radial-gradient(36% 50% at 50% 30%, rgb(124 92 255 / .38), transparent 70%),
      radial-gradient(30% 40% at 70% 100%, color-mix(in oklab, var(--au3) 40%, transparent), transparent 70%);
  }
  .curtains { position: absolute; inset: -40px 0 80px; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 60%, transparent); }
  .curtains i {
    position: absolute;
    top: 0;
    width: var(--w);
    height: 100%;
    background: radial-gradient(50% 50% at 50% 60%, var(--c), color-mix(in oklab, var(--c) 40%, transparent) 50%, transparent);
    opacity: .55;
    transform: skewX(var(--k));
  }
  .curtains i:nth-child(1) { --c: #7c5cff; --w: 200px; --k: -18deg; left: 120px; }
  .curtains i:nth-child(2) { --c: color-mix(in oklab, var(--au2), white 20%); --w: 150px; --k: -24deg; left: 360px; }
  .curtains i:nth-child(3) { --c: #19c2b0; --w: 130px; --k: -10deg; left: 600px; opacity: .4; }
  .curtains i:nth-child(4) { --c: var(--au1); --w: 220px; --k: -20deg; left: 830px; }
  .stars {
    position: absolute;
    inset: 0;
    opacity: .55;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 9%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 38% 31%, #fff, transparent), radial-gradient(1px 1px at 88% 41%, #fff, transparent),
      radial-gradient(1px 1px at 22% 63%, #fff, transparent), radial-gradient(1.4px 1.4px at 57% 12%, #fff, transparent),
      radial-gradient(1px 1px at 93% 86%, #fff, transparent), radial-gradient(1px 1px at 46% 52%, #fff, transparent);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgb(255 255 255 / .045) 1px, transparent 1px),
                      linear-gradient(90deg, rgb(255 255 255 / .045) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(60% 70% at 50% 40%, #000, transparent);
  }
  /* the rim of the dark planet */
  .rim {
    position: absolute;
    left: 50%;
    bottom: -530px;
    width: 2100px;
    height: 640px;
    border-radius: 50%;
    background: #07070e;
    box-shadow: 0 -1px 0 rgb(226 220 255 / .8), 0 -10px 30px -6px rgb(140 112 255 / .9), 0 -44px 120px -16px rgb(47 107 255 / .6);
    translate: -50% 0;
  }

  .text {
    position: absolute;
    z-index: 2;
    top: 64px;
    inset-inline-start: 76px;
    width: 560px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 26px;
    padding: 8px 22px;
    padding-inline-start: 18px;
    border: 1.5px solid rgb(255 255 255 / .14);
    border-radius: 999px;
    background: rgb(16 15 29 / .72);
    color: #d6d2e8;
    font-size: 23px;
    font-weight: 600;
  }
  .eyebrow::before {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 5px rgb(74 222 128 / .22), 0 0 16px #4ade80;
  }
  h1 {
    margin: 0 0 24px;
    font-family: 'Rubik', 'Heebo', sans-serif;
    font-size: 104px;
    font-weight: 800;
    line-height: .96;
    letter-spacing: -0.03em;
    background: linear-gradient(100deg, #f5f3ff 0%, #f5f3ff 30%, #cbbcff 52%, #ffd08a 72%, #f5f3ff 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 30px rgb(124 92 255 / .35));
  }
  [lang="en"] h1 { font-size: 100px; letter-spacing: -0.035em; }
  .lead {
    margin: 0;
    color: #d6d2e8;
    font-size: 27px;
    line-height: 1.5;
  }

  .chips {
    position: absolute;
    z-index: 3;
    bottom: 40px;
    inset-inline-start: 76px;
    display: flex;
    gap: 12px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 20px;
    padding-inline-start: 8px;
    border: 1.5px solid rgb(255 255 255 / .12);
    border-radius: 999px;
    background: rgb(16 15 30 / .9);
    box-shadow: 0 0 34px -10px var(--a), 0 18px 40px -20px #000;
    font-size: 21px;
    font-weight: 700;
    white-space: nowrap;
  }
  .chip .icon {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    overflow: hidden;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--a2), var(--a));
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-weight: 800;
    font-size: 21px;
  }
  .chip .icon img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .chip .icon--thumb { width: 64px; border-radius: 999px; box-shadow: 0 0 0 1.5px rgb(255 255 255 / .2); }

  /* the devices */
  .stage {
    position: absolute;
    z-index: 1;
    top: 0;
    bottom: 0;
    inset-inline-end: 0;
    width: 560px;
  }
  .halo {
    position: absolute;
    inset: 60px 20px 40px;
    background:
      radial-gradient(40% 44% at 40% 40%, color-mix(in srgb, var(--au2) 75%, transparent), transparent 70%),
      radial-gradient(34% 40% at 64% 58%, color-mix(in srgb, var(--au1) 70%, transparent), transparent 70%),
      radial-gradient(30% 30% at 50% 22%, rgb(124 92 255 / .6), transparent 70%);
    opacity: .7;
  }
  .window {
    position: absolute;
    top: 92px;
    inset-inline-end: 40px;
    width: 420px;
    overflow: hidden;
    border-radius: 14px;
    background: #151b24;
    box-shadow: 0 0 0 1.5px rgb(255 255 255 / .18), 0 40px 80px -24px #000, 0 0 100px -20px var(--au2);
    rotate: calc(-2deg * var(--flip));
  }
  .window img { display: block; width: 100%; }
  .phone {
    position: absolute;
    z-index: 2;
    top: 150px;
    inset-inline-end: 330px;
    width: 196px;
    padding: 8px;
    border-radius: 30px;
    background: linear-gradient(150deg, #4a4956, #141419 30%, #0c0c10 70%, #2a2933);
    box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .2), 0 0 0 1px #000, 0 40px 70px -20px #000, 0 0 90px -16px var(--au1);
    rotate: calc(5deg * var(--flip));
  }
  .phone img { display: block; width: 100%; border-radius: 23px; }
  .window::after, .phone::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(120deg, rgb(255 255 255 / .16), transparent 30%, transparent 70%, rgb(255 255 255 / .05));
  }
  :root { --flip: 1; }
  [dir="ltr"] { --flip: -1; }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="curtains"><i></i><i></i><i></i><i></i></div>
  <div class="stars"></div>
  <div class="grid"></div>
  <div class="rim"></div>
  <div class="stage">
    <div class="halo"></div>
    $devices
  </div>
  <div class="text">
    <p class="eyebrow">$eyebrow</p>
    <h1>$title</h1>
    <p class="lead">$lead</p>
  </div>
  <div class="chips">$chips</div>
</body>
</html>
