<!doctype html>
<html lang="$lang" dir="$dir">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <script>document.documentElement.classList.add('js')</script>
  <meta name="description" content="$description">$head
  <meta property="og:type" content="website">
  <meta property="og:locale" content="$locale">
  <meta property="og:site_name" content="$title">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f3f1fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07070e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="${root}favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="${root}icons/apple-touch-icon.png">
  <link rel="manifest" href="${root}site.webmanifest">
  <link rel="preload" href="${root}fonts/heebo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="${root}fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="${root}site.css">
  <script src="${root}site.js" defer></script>$ads_head
</head>
<body style="$aurora">$video
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <a class="skip" href="#main">$skip</a>

  <nav class="topbar" aria-label="$nav_label">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top" aria-label="$home_label"><span class="brand-mark" aria-hidden="true">ים</span></a>
      <div class="cats" role="group" aria-label="$cats_label">$nav</div>
      <a class="lang" href="$switch_href" hreflang="$switch_lang" lang="$switch_lang" dir="$switch_dir"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></g></svg><span class="lang-short" aria-hidden="true">$switch_short</span><span class="lang-full">$switch_label</span></a>
    </div>
  </nav>

  <header class="hero $hero_class" id="top">
    <div class="curtains" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="space" aria-hidden="true">
      <div class="nebula"></div>
      <div class="stars stars--far"><i></i></div>
      <div class="stars stars--mid"><i></i></div>
      <div class="stars stars--near">$near_stars</div>
      <div class="meteors"><i></i><i></i><i></i></div>
    </div>
    <div class="horizon" aria-hidden="true"><i class="rim-light"><i></i></i></div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>$eyebrow</p>
        <h1><span class="sheen">$headline</span><span class="shine" aria-hidden="true"><span>$headline</span></span></h1>
        <p class="lead">$lead</p>
        <div class="hero-actions">
          <span class="cta"><span class="cta-glow" aria-hidden="true"></span><a class="btn btn--glow" href="#main">$cta $down</a></span>$donate_hero
        </div>
      </div>$showcase
      <div class="hero-meta">
        <dl class="stats">$stats</dl>
        <nav class="index$index_class" aria-labelledby="index-title">
          <h2 class="index-title" id="index-title">$index_label</h2>
          <ol>$index</ol>
        </nav>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">$sections$ad_end
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span class="brand-mark brand-mark--small" aria-hidden="true">ים</span>
      <p>$footer</p>$privacy
      <p class="foot-date">$updated_label<time datetime="$updated_iso" dir="ltr">$updated</time></p>
      <div class="foot-actions">$donate_foot<a class="to-top" href="#top">$back_to_top $up</a></div>
    </div>
  </footer>
</body>
</html>
