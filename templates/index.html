<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:site_name" content="$title">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta name="twitter:card" content="summary_large_image">$share
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/heebo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <a class="skip" href="#main">דילוג לפרויקטים</a>

  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">$eyebrow</p>
      <h1>$title</h1>
      <p class="lead">$lead</p>
      <dl class="stats">$stats</dl>
    </div>
  </header>

  <nav class="cats" aria-label="קטגוריות">
    <div class="wrap">$nav</div>
  </nav>

  <main id="main" class="wrap">$sections
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>נבנה ב-HTML ו-CSS, בלי עוגיות ובלי מעקב.</p>
      <p>עודכן ב-$updated</p>
    </div>
  </footer>
</body>
</html>
