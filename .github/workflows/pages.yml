# Publishes public/ to GitHub Pages on every push to main.
#
# Nothing is built here: tools/build.py (and tools/og.py for the share images) already rendered
# public/ on the PC, the same way as hinachti-site. The job only checks that the page is there
# and uploads the folder.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The pages have to be there
        run: |
          test -f public/index.html
          test -f public/en/index.html
          test -f public/404.html
          test -f public/og.jpg
          test -f public/og-en.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
